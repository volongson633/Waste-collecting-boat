[platformio]
default_envs = boat-live

[boat]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
lib_deps = bblanchon/ArduinoJson@6.21.5
extra_scripts = pre:scripts/embed_web.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1

; Camera and manual controls with simulated motor outputs.
[env:camera-control]
extends = boat
build_flags =
    ${boat.build_flags}
    -DBOAT_OUTPUTS_ENABLED=0
    -DBOAT_VISION_BACKEND=0

; Adds the red-marker detector with simulated motor outputs.
[env:boat-bench]
extends = boat
build_flags =
    ${boat.build_flags}
    -DBOAT_OUTPUTS_ENABLED=0
    -DBOAT_VISION_BACKEND=1

; Real motor outputs with the current board wiring.
[env:boat-live]
extends = boat
build_flags =
    ${boat.build_flags}
    -DBOAT_OUTPUTS_ENABLED=1
    -DBOAT_BATTERY_REQUIRED=0
    -DBOAT_VISION_BACKEND=0

; The external four-pin RGB LED environment (boat-live-rgb4) was removed: it needs
; GPIO40, which now belongs to the on-board microSD slot.

; Data collection: camera stream, manual drive + manual shot, and auto mode that
; drives a fixed pattern while saving frames to the SD card at an adjustable rate.
; Separate firmware with its own setup()/loop() in src/collector/; same pins and modules.
[env:data-collect]
extends = boat
build_src_filter = +<*> -<main.cpp> -<web_control.cpp> -<camera_web.cpp> -<conveyor_test.cpp>
build_flags =
    ${boat.build_flags}
    -DBOAT_OUTPUTS_ENABLED=1
    -DBOAT_BATTERY_REQUIRED=0
    -DBOAT_VISION_BACKEND=0
    -DBOAT_COLLECTOR=1

; Requires an exported Edge Impulse Arduino library and include/ei_model.h.
[env:boat-ai]
extends = boat
lib_ldf_mode = deep+
build_flags =
    ${boat.build_flags}
    -DBOAT_OUTPUTS_ENABLED=1
    -DBOAT_VISION_BACKEND=2

; Standalone conveyor test with its own setup() and loop().
[env:conveyor-test]
extends = boat
lib_deps =
extra_scripts =
build_src_filter = +<conveyor_test.cpp>
build_flags =
    ${boat.build_flags}
    -DBOAT_CONVEYOR_TEST=1

; Runs controller tests on Windows, without a connected board.
[env:test-windows]
platform = windows_x86@1.2.0
build_flags = -std=gnu++11
test_framework = unity
test_build_src = no
test_filter = test_core

[env:test-native]
platform = native@1.2.1
build_flags = -std=gnu++11
test_framework = unity
test_build_src = no
test_filter = test_core
